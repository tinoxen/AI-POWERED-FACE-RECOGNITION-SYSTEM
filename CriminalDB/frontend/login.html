<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CriminalDB</title>
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("CriminalDB_theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
</head>
<body>
  <!-- Animated HUD Background -->
  <div class="cyber-bg">
    <div class="cyber-grid"></div>
    <div class="hologram-glow"></div>
  </div>
  <div class="scanline-overlay"></div>
  <div class="center-screen">
    <div class="login-card">
      <button type="button" id="theme-toggle" class="theme-toggle"></button>
      <div class="login-logo">
        <div class="login-brand">
          <img class="brand-logo" src="assets/shield-logo.svg" alt="CriminalDB shield">
          <div class="login-wordmark">
            <span class="brand-name">Criminal<span class="brand-accent">DB</span></span>
            <span class="brand-tagline">Secured Criminal Database</span>
          </div>
        </div>
      </div>
      <p class="subtitle" style="text-align: center; margin-bottom: 24px;">Authorized operations only. Activity is
        recorded in security audit logs.</p>
      <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="Enter operator ID" required>
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter authorization key"
            required>
          <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password"
            title="Show password" aria-pressed="false">
            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="2.5"></circle>
            </svg>
            <svg class="eye-slash" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 3 18 18"></path>
              <path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.7 16.7 0 0 1-3.1 3.5M6.2 6.8C3.9 8.3 2.5 12 2.5 12s3.5 6 9.5 6c1.3 0 2.5-.3 3.5-.7"></path>
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
            </svg>
          </button>
        </div>
        <div class="form-actions" style="margin-top: 24px;">
          <button type="submit" style="width:100%;">Authenticate</button>
        </div>
        <div class="error-msg" id="error-msg" style="text-align: center;"></div>
      </form>
    </div>
  </div>
  <script src="js/api-config.js"></script>
  <script src="js/api.js"></script>
  <script>
    updateThemeToggle();
    document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
    if (Auth.isLoggedIn()) window.location.href = "dashboard.html";

    document.getElementById("password-toggle").addEventListener("click", function () {
      const passwordInput = document.getElementById("password");
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      this.dataset.visible = String(!isVisible);
      this.setAttribute("aria-label", isVisible ? "Show password" : "Hide password");
      this.setAttribute("title", isVisible ? "Show password" : "Hide password");
      this.setAttribute("aria-pressed", String(!isVisible));
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const errorMsg = document.getElementById("error-msg");
      errorMsg.textContent = "";
      try {
        const res = await fetch(API_BASE + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        if (res.status === 401) {
          errorMsg.textContent = "ACCESS DENIED: Invalid operator ID or password.";
          return;
        }
        if (!res.ok) {
          const errorText = await res.text();
          console.error("LOGIN STATUS:", res.status, errorText);
          errorMsg.textContent = `SERVICE ERROR (${res.status}): ${errorText || "The backend could not complete login."}`;
          return;
        }
        const data = await res.json();
        Auth.setSession(data.token, data.username, data.role);
        window.location.href = "dashboard.html";
      } catch (err) {
        errorMsg.textContent = "COMMUNICATION FAILURE: Cannot establish connection.";
      }
    });
  </script>
</body>
</html>
