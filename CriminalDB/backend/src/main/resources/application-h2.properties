# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Useful for demoing the app before MySQL is set up.
spring.datasource.url=jdbc:h2:mem:facedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Development-only fallback so the documented H2 demo command runs without
# additional environment setup. Production must set APP_JWT_SECRET.
app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-before-production-2026}
