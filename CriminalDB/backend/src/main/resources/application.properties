# --- Server ---
server.port=8080

# --- MySQL (default profile) ---
spring.datasource.url=jdbc:mysql://localhost:3306/facedb?useSSL=false&serverTimezone=UTC
spring.datasource.username=facedb_user
spring.datasource.password=change_me
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=uploads

# --- JWT ---
# IMPORTANT: override this with a long random value via an environment variable
# (e.g. APP_JWT_SECRET) before running anywhere but your own machine.
app.jwt.secret=CHANGE_ME_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING
app.jwt.expiration-ms=3600000
