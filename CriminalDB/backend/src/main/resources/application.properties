# --- Server ---
# Bind to the port Render provides via the PORT env var; default to 8080 locally
server.port=${PORT:8080}

# --- Database ---
# Prefer TiDB Cloud / MySQL settings from environment variables.
# If you already have a full JDBC URL, set DB_URL directly.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:facedb}?sslMode=DISABLED&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Static frontend assets ---
# In Docker/Render, the frontend files are mounted to APP_STATIC_DIR so the same service can serve the UI.
spring.web.resources.static-locations=classpath:/static/,file:${APP_STATIC_DIR:./frontend}

# --- File uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:9f8365e544e4fd3fe196b72483937e28}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
