# --- Server ---
server.port=${PORT:8080}

# --- MySQL (default profile) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/facedb?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:facedb_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
