# ========================================================
# SERVER
# =========================================================

server.port=${PORT:10000}


# =========================================================
# DATABASE - TiDB Cloud
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_IDENTITY
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# =========================================================
# FRONTEND
# =========================================================

spring.web.resources.static-locations=classpath:/static/,file:${APP_STATIC_DIR:./frontend}


# =========================================================
# FILE UPLOADS
# =========================================================


spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=${APP_UPLOAD_DIR:uploads}


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=never
server.error.include-stacktrace=never


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
