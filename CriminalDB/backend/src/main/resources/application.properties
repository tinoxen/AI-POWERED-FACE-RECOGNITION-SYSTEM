# --- Server ---
# Bind to the port Render provides via the PORT env var; default to 8080 locally
server.port=${PORT:8080}

# --- Database (use DB_* environment variables) ---
# Defaults below come from the previous configuration (non-sensitive defaults).
# Use DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in Render service settings.
spring.datasource.url=jdbc:mysql://${DB_HOST:gateway01.ap-southeast-1.prod.aws.tidbcloud.com}:${DB_PORT:4000}/${DB_NAME:facedb}?sslMode=VERIFY_IDENTITY&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:ZC5fiyoLs7pASYG.root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- File uploads ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=${APP_UPLOAD_DIR:uploads}

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:9f8365e544e4fd3fe196b72483937e28}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
