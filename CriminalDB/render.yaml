services:
  - type: web
    name: criminaldb
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_UPLOAD_DIR
        value: /tmp/uploads
      - key: ALLOWED_ORIGINS
        value: https://*.onrender.com
      - key: DB_HOST
        value: your-tidb-host
      - key: DB_PORT
        value: 4000
      - key: DB_NAME
        value: facedb
      - key: DB_USERNAME
        value: your-username
      - key: DB_PASSWORD
        value: your-password
